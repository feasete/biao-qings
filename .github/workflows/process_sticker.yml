name: Process Sticker Submission

on:
  issues:
    types: [opened]

jobs:
  process-sticker:
    if: contains(github.event.issue.labels.*.name, 'sticker-submission')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Parse Issue and Download Image
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'EOF'
          import os, re, requests, urllib.parse

          body = os.environ.get('ISSUE_BODY', '')
          
          category_match = re.search(r'### 分类文件夹\s*\n\s*(.*?)\s*\n', body)
          category = category_match.group(1).strip() if category_match else "zz-new"
          
          remark_match = re.search(r'### 表情包备注\s*\n\s*(.*?)\s*\n', body)
          remark = remark_match.group(1).strip() if remark_match else "未命名"
          
          # 👇 更强大的正则：同时匹配 Markdown 和 HTML 格式的图片链接
          img_match = re.search(r'\((https://github\.com/user-attachments/assets/.*?)\)', body) or \
                      re.search(r'src="(https://github\.com/user-attachments/assets/.*?)"', body)
          
          if not img_match:
              print("⚠️ 未在 Issue 中找到 GitHub 上传的图片链接，跳过。")
              # 写一个标记，告诉下一步不要提交
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write("SKIP_COMMIT=true\n")
              exit(0)
              
          img_url = img_match.group(1)
          print(f"提取到图片链接: {img_url}")
          
          headers = {'User-Agent': 'Mozilla/5.0'}
          img_data = requests.get(img_url, headers=headers).content
          
          safe_remark = re.sub(r'[\\/:*?"<>|]', '_', remark)
          filename = f"{safe_remark}.png"
          
          folder_path = os.path.join(category)
          os.makedirs(folder_path, exist_ok=True)
          
          filepath = os.path.join(folder_path, filename)
          with open(filepath, 'wb') as f:
              f.write(img_data)
              
          print(f"✅ 图片已保存至: {filepath}")
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"IMAGE_PATH={filepath}\n")
              f.write("SKIP_COMMIT=false\n")
          EOF

      - name: Commit and Push
        if: env.SKIP_COMMIT != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          # 👇 加一层保险，如果有变化才提交
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-add sticker from issue #${{ github.event.issue.number }}"
            git push
          else
            echo "没有文件变化，跳过提交"
          fi

      - name: Comment and Close Issue
        if: env.SKIP_COMMIT != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const imagePath = process.env.IMAGE_PATH;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🎉 感谢贡献！你的表情包已经成功自动收纳到 \`${imagePath}\` 啦！`
            });
            github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed'
            });
