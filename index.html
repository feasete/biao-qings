<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的赛博表情包库</title>
    <style>
        :root {
            --bg-color: #f6f8fa;
            --text-color: #24292f;
            --card-bg: #ffffff;
            --border-color: #d0d7de;
            --primary: #0969da;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .header h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        .header p {
            font-size: 14px;
            color: #57606a;
        }
        /* 网格布局：自动适应屏幕宽度 */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 16px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .img-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .img-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(140,149,159,0.2);
        }
        .img-card img {
            width: 100%;
            height: 150px;
            object-fit: contain; /* 保证表情包完整显示，不被裁剪 */
            border-radius: 8px;
            background-color: #f6f8fa; /* 透明背景的表情包底色 */
        }
        .img-name {
            margin-top: 8px;
            font-size: 12px;
            color: #57606a;
            width: 100%;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        /* 提示框 */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: #24292f;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 1000;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🐾 我的赛博表情包库</h1>
        <p>点击图片即可复制引用链接（已启用 jsDelivr 加速）</p>
    </div>

    <div class="gallery" id="gallery">
        <!-- 图片由 JS 动态生成 -->
    </div>

    <div class="toast" id="toast">✅ 链接已复制到剪贴板！</div>

    <script>
        // ==========================================
        // 👇 在这里填入你的表情包文件名 👇
        // 如果你建了文件夹，请带上文件夹名，例如: "images/doge.png"
        // ==========================================
        const imageFiles = [
            "1.png", 
            "2.gif", 
            "test.jpg"
        ];

        // ==========================================
        // 👇 自动生成你的基础链接（不用改） 👇
        // 格式: https://cdn.jsdelivr.net/gh/用户名/仓库名@分支/
        // ==========================================
        const githubUser = "feasete";
        const repoName = "BIAOQING";
        const branch = "main";
        const baseUrl = `https://raw.githubusercontent.com/${githubUser}/${repoName}/${branch}/`;

        const gallery = document.getElementById('gallery');
        const toast = document.getElementById('toast');

        // 生成展示页面
        imageFiles.forEach(fileName => {
            const fullUrl = baseUrl + fileName;
            
            // 创建卡片
            const card = document.createElement('div');
            card.className = 'img-card';
            
            // 创建图片
            const img = document.createElement('img');
            img.src = fullUrl;
            img.loading = 'lazy'; // 懒加载，省流量
            img.alt = fileName;
            
            // 创建文件名文字
            const nameDiv = document.createElement('div');
            nameDiv.className = 'img-name';
            // 去掉路径，只显示文件名
            nameDiv.innerText = fileName.split('/').pop(); 
            
            card.appendChild(img);
            card.appendChild(nameDiv);

            // 点击复制功能
            card.addEventListener('click', () => {
                navigator.clipboard.writeText(fullUrl).then(() => {
                    showToast();
                }).catch(err => {
                    alert('复制失败，请手动复制：' + fullUrl);
                });
            });

            gallery.appendChild(card);
        });

        // 显示提示框
        let toastTimer;
        function showToast() {
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }
    </script>
</body>
</html>
