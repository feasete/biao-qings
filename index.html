<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的赛博表情包库</title>
    <style>
        :root { --bg-color: #f6f8fa; --text-color: #24292f; --card-bg: #ffffff; --border-color: #d0d7de; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; }
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { font-size: 24px; margin-bottom: 8px; }
        .header p { font-size: 14px; color: #57606a; }
        
        .category-title { max-width: 1200px; margin: 40px auto 16px; font-size: 18px; border-bottom: 2px solid var(--border-color); padding-bottom: 8px; display: flex; align-items: center; gap: 10px; }
        .category-title span { font-size: 14px; color: #57606a; font-weight: normal; }
        
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 16px; max-width: 1200px; margin: 0 auto; }
        .img-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 8px; display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
        .img-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(140,149,159,0.2); }
        .img-card img { width: 100%; height: 130px; object-fit: contain; border-radius: 8px; background-color: #f6f8fa; }
        .img-name { margin-top: 8px; font-size: 12px; color: #57606a; width: 100%; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .loading { text-align: center; margin-top: 50px; font-size: 16px; color: #57606a; }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background-color: #24292f; color: white; padding: 10px 20px; border-radius: 20px; font-size: 14px; opacity: 0; transition: all 0.3s ease; pointer-events: none; z-index: 1000; }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🐾 我的赛博表情包库</h1>
        <p>点击图片即可复制引用链接</p>
    </div>

    <div id="app">
        <div class="loading">🐈 正在扫描文件夹，请稍候...</div>
    </div>

    <div class="toast" id="toast">✅ 链接已复制到剪贴板！</div>

    <script>
        // ==========================================
        // 👇 基础配置 👇
        // ==========================================
        const githubUser = "feasete";
        const repoName = "biao-qings"; 
        const branch = "main"; 
        
        // 你要展示的文件夹分类（左边的名字随便起，右边的值必须是 GitHub 里的真实文件夹名）
        const folderMap = {
            "宝宝狗/狗狗": "bbgs",
            "纯洁小猫/贴贴": "cjxmzsb",
            "其他分类P": "pes",
            "修狗与小猫": "xmxg"
            "未分类": "zz"
        };

        const app = document.getElementById('app');
        const toast = document.getElementById('toast');

        // 核心逻辑：自动扫描目录
        async function loadStickers() {
            app.innerHTML = ''; // 清空 loading

            // 遍历你要展示的文件夹
            for (const [categoryName, folderName] of Object.entries(folderMap)) {
                try {
                    // 使用 jsDelivr 的 Data API 获取文件夹下的文件列表（不限流，免 403）
                    const apiUrl = `https://data.jsdelivr.com/v1/packages/gh/${githubUser}/${repoName}@${branch}`;
                    const response = await fetch(apiUrl);
                    if (!response.ok) continue;
                    
                    const data = await response.json();
                    
                    // 从返回的完整文件树中，找到对应的文件夹
                    const targetFolder = data.files.find(f => f.type === 'directory' && f.name === folderName);
                    if (!targetFolder || !targetFolder.files) continue;

                    // 过滤出图片文件
                    const imageFiles = targetFolder.files.filter(file => 
                        file.type === 'file' && /\.(png|jpe?g|gif|webp|svg)$/i.test(file.name)
                    );

                    if (imageFiles.length === 0) continue;

                    // 生成分类标题
                    const title = document.createElement('h2');
                    title.className = 'category-title';
                    title.innerHTML = `${categoryName} <span>(${imageFiles.length}张)</span>`;
                    app.appendChild(title);

                    // 生成图片网格
                    const gallery = document.createElement('div');
                    gallery.className = 'gallery';

                    imageFiles.forEach(file => {
                        // 使用相对路径，直接从你当前的 GitHub Pages 加载图片，速度极快！
                        // 注意：这里不带域名，直接是 folder/file 格式
                        const encodedPath = `${folderName}/${file.name}`.split('/').map(encodeURIComponent).join('/');
                        
                        // 如果是为了复制给别人用，我们需要完整的域名
                        const fullUrl = `https://feasete.github.io/${repoName}/${encodedPath}`;

                        const card = document.createElement('div');
                        card.className = 'img-card';
                        
                        const img = document.createElement('img');
                        img.src = encodedPath; // 本地相对路径加载展示
                        img.loading = 'lazy';
                        img.alt = file.name;
                        
                        const nameDiv = document.createElement('div');
                        nameDiv.className = 'img-name';
                        nameDiv.innerText = file.name;
                        nameDiv.title = file.name;
                        
                        card.appendChild(img);
                        card.appendChild(nameDiv);

                        // 点击复制时，复制完整的网页链接
                        card.addEventListener('click', () => {
                            navigator.clipboard.writeText(fullUrl).then(() => {
                                showToast();
                            }).catch(() => {
                                alert('复制失败，请手动复制：' + fullUrl);
                            });
                        });

                        gallery.appendChild(card);
                    });
                    
                    app.appendChild(gallery);
                } catch (error) {
                    console.error(`加载 ${folderName} 失败:`, error);
                }
            }
        }

        let toastTimer;
        function showToast() {
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { toast.classList.remove('show'); }, 2000);
        }

        // 启动！
        loadStickers();
    </script>
</body>
</html>
